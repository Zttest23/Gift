<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><title>Digital Gift</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#ff69b433,transparent 35%),radial-gradient(circle at 80% 30%,#7d6eff33,transparent 36%),linear-gradient(145deg,#08080b,#17131b 55%,#09090b)}main{max-width:900px;margin:auto;padding:55px 20px 80px;text-align:center}.k{font-size:11px;letter-spacing:.2em;opacity:.6}h1{font-size:clamp(34px,8vw,76px);line-height:1.08;margin:18px auto;max-width:760px}.name{font-size:20px;opacity:.82}.msg{white-space:pre-wrap;max-width:680px;margin:42px auto;font-size:18px;line-height:2;opacity:.92}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:35px 0}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}.ending{margin-top:45px;font-size:17px;line-height:1.9;opacity:.75}.lock{position:fixed;inset:0;display:grid;place-items:center;background:#09090dee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5;text-align:center;padding:20px}.count{font-size:clamp(30px,9vw,58px);font-variant-numeric:tabular-nums;margin:20px 0}.music{margin-top:28px;border:0;border-radius:999px;padding:12px 20px}.hidden{display:none!important}.fade{animation:f .9s ease both}@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style></head><body><div class="bg"></div><div id="lock" class="lock"><div><div class="k">A LITTLE SURPRISE</div><h2>还没到解锁时间</h2><div id="count" class="count">加载中…</div><p>等时间到了，再打开看看。</p></div></div><main id="content" class="hidden"><div class="k">A LITTLE SURPRISE</div><h1 id="title"></h1><div id="name" class="name"></div><div id="msg" class="msg"></div><div id="gallery" class="gallery"></div><div id="ending" class="ending"></div><button id="mb" class="music hidden">播放音乐</button><audio id="audio" loop playsinline></audio></main><script>
(async()=>{const q=new URLSearchParams(location.search),id=q.get('id'),sp=q.get('s'),lock=document.getElementById('lock'),count=document.getElementById('count'),content=document.getElementById('content');function dec(s){try{return decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))}catch{return null}}let cfg;try{cfg=JSON.parse(dec(sp)||'')}catch{}if(!id||!cfg?.url||!cfg?.key){lock.innerHTML='<div><h2>链接不完整</h2><p>请让对方重新发送完整链接。</p></div>';return}const jsonUrl=cfg.url.replace(/\/$/,'')+'/storage/v1/object/public/gift_media/gift/'+encodeURIComponent(id)+'/gift.json';let gift;try{const r=await fetch(jsonUrl,{cache:'no-store'});if(!r.ok)throw 0;gift=await r.json()}catch{lock.innerHTML='<div><h2>这个礼物暂时无法打开</h2><p>请确认链接完整，或稍后重试。</p></div>';return}document.title=gift.title||'Digital Gift';document.getElementById('title').textContent=gift.title||'';document.getElementById('name').textContent=gift.name?'给 '+gift.name:'';const audio=document.getElementById('audio'),mb=document.getElementById('mb');function unlock(){document.getElementById('msg').textContent=gift.message||'';document.getElementById('ending').textContent=gift.ending||'';(gift.photos||[]).forEach(src=>{const i=document.createElement('img');i.loading='lazy';i.src=src;document.getElementById('gallery').appendChild(i)});if(gift.music){audio.src=gift.music;mb.classList.remove('hidden');mb.onclick=()=>{if(audio.paused){audio.play().then(()=>mb.textContent='暂停音乐').catch(()=>{})}else{audio.pause();mb.textContent='播放音乐'}}}lock.classList.add('hidden');content.classList.remove('hidden');content.classList.add('fade')}function tick(){if(gift.unlockAtMs===null||gift.unlockAtMs===undefined||Date.now()>=gift.unlockAtMs){unlock();clearInterval(loop);return}const d=Math.max(0,gift.unlockAtMs-Date.now()),s=Math.floor(d/1000),day=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;count.textContent=(day?day+'天 ':'')+[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')}tick();const loop=setInterval(tick,250)})();
</script></body></html>
